name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Tests (local FHEVM mock, solc-js)
        run: npm test
        env:
          SOLCJS: "1"
      - name: Demo run
        run: npm run demo
        env:
          SOLCJS: "1"
      - name: Type check
        run: npx tsc --noEmit
